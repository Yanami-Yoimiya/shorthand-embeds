<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kove & ZXMOTO Sales Growth</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:transparent;color:#1a1a1a;padding:24px 20px}
  @media(prefers-color-scheme:dark){body{color:#e0e0e0}}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:14px;font-size:12px;color:#666}
  @media(prefers-color-scheme:dark){.legend{color:#aaa}}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend .dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
  .legend .diamond{width:0;height:0;border:5px solid transparent;border-bottom-color:#D4537E;position:relative;top:-5px}
  .legend .diamond::after{content:'';position:absolute;left:-5px;top:5px;width:0;height:0;border:5px solid transparent;border-top-color:#D4537E}
  .chart-wrap{position:relative;width:100%;height:380px}
  .source{font-size:11px;color:#999;margin-top:10px;line-height:1.5}
  @media(prefers-color-scheme:dark){.source{color:#777}}
  @media(max-width:600px){
    .chart-wrap{height:300px}
    body{padding:16px 12px}
  }
</style>
</head>
<body>

<div class="legend">
  <span><span class="dot" style="background:#1D9E75"></span>Kove (凯越)</span>
  <span><span class="dot" style="background:#D85A30"></span>ZXMOTO (张雪机车)</span>
  <span><span class="dot" style="background:rgba(55,138,221,0.4);border:1px dashed #378ADD"></span>2026 target</span>
  <span><span class="diamond"></span><span style="position:relative;top:0">Product launch</span></span>
</div>

<div class="chart-wrap">
  <canvas id="salesChart" role="img" aria-label="Bar chart of annual motorcycle sales from 2018 to 2026 with product launch milestones"></canvas>
</div>

<p class="source">
  Data sources: Zhang Xue interviews (CCTV Face to Face, 21CBR, The Paper, Sina). 2020–2021 are estimates. 2026 is a stated target. Hover/tap bars for details.
</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
  var isDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  var gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  var tickColor = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.45)';

  var labels = ['2018','2019','2020','2021','2022','2023','2024','2025','2026'];
  var koveData = [800, 3000, 12000, 20000, 28000, 30000, null, null, null];
  var zxData = [null, null, null, null, null, null, null, 22000, null];
  var targetData = [null, null, null, null, null, null, null, null, 60000];

  var milestones = [
    {x:'2018', y:800, label:'500X launched'},
    {x:'2020', y:12000, label:'321R street bike'},
    {x:'2021', y:20000, label:'321RR sport bike'},
    {x:'2022', y:28000, label:'400RR / Nat\'l team'},
    {x:'2023', y:30000, label:'450RR / Dakar Rally'},
    {x:'2025', y:22000, label:'500RR + 820RR'},
    {x:'2026', y:60000, label:'WSBK double win'}
  ];

  var milestonePlugin = {
    id: 'milestones',
    afterDatasetsDraw: function(chart) {
      var ctx = chart.ctx;
      var xScale = chart.scales.x;
      var yScale = chart.scales.y;
      ctx.save();
      milestones.forEach(function(m) {
        var xPos = xScale.getPixelForValue(m.x);
        var yPos = yScale.getPixelForValue(m.y);
        ctx.fillStyle = '#D4537E';
        ctx.beginPath();
        ctx.moveTo(xPos, yPos - 10);
        ctx.lineTo(xPos + 5, yPos - 5);
        ctx.lineTo(xPos, yPos);
        ctx.lineTo(xPos - 5, yPos - 5);
        ctx.closePath();
        ctx.fill();
        ctx.font = '500 11px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillStyle = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.55)';
        ctx.textAlign = 'center';
        ctx.fillText(m.label, xPos, yPos - 18);
      });
      ctx.restore();
    }
  };

  var gapPlugin = {
    id: 'gapLine',
    afterDatasetsDraw: function(chart) {
      var ctx = chart.ctx;
      var xScale = chart.scales.x;
      var yScale = chart.scales.y;
      var x2023 = xScale.getPixelForValue('2023');
      var x2025 = xScale.getPixelForValue('2025');
      var xMid = xScale.getPixelForValue('2024');
      ctx.save();
      ctx.setLineDash([4,4]);
      ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x2023, yScale.getPixelForValue(30000));
      ctx.lineTo(x2025, yScale.getPixelForValue(22000));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.fillStyle = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.35)';
      ctx.textAlign = 'center';
      ctx.fillText('Left Kove', xMid, yScale.getPixelForValue(26000));
      ctx.fillText('Founded ZXMOTO', xMid, yScale.getPixelForValue(23000));
      ctx.restore();
    }
  };

  new Chart(document.getElementById('salesChart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Kove (凯越)',
          data: koveData,
          backgroundColor: '#1D9E75',
          borderRadius: 4,
          barPercentage: 0.6
        },
        {
          label: 'ZXMOTO (张雪机车)',
          data: zxData,
          backgroundColor: '#D85A30',
          borderRadius: 4,
          barPercentage: 0.6
        },
        {
          label: '2026 target',
          data: targetData,
          backgroundColor: isDark ? 'rgba(55,138,221,0.35)' : 'rgba(55,138,221,0.25)',
          borderColor: '#378ADD',
          borderWidth: 1,
          borderDash: [4,4],
          borderRadius: 4,
          barPercentage: 0.6
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 30 } },
      scales: {
        x: {
          stacked: true,
          grid: { display: false },
          ticks: { color: tickColor, font: { size: 12 } }
        },
        y: {
          stacked: true,
          beginAtZero: true,
          max: 65000,
          grid: { color: gridColor },
          ticks: {
            color: tickColor,
            font: { size: 11 },
            callback: function(v) { return v >= 1000 ? Math.round(v/1000) + 'k' : v; }
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var v = ctx.parsed.y;
              if (!v) return '';
              var formatted = v >= 1000 ? (v/1000).toLocaleString() + 'k' : v;
              return ctx.dataset.label + ': ' + formatted + ' units';
            }
          }
        }
      }
    },
    plugins: [milestonePlugin, gapPlugin]
  });
})();
</script>
</body>
</html>
