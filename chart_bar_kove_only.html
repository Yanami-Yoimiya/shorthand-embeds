<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kove Sales Growth</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:transparent;color:#1a1a1a;padding:24px 20px}
  @media(prefers-color-scheme:dark){body{color:#e0e0e0}}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:14px;font-size:12px;color:#666}
  @media(prefers-color-scheme:dark){.legend{color:#aaa}}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend .dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
  .chart-wrap{position:relative;width:100%;height:440px}
  .source{font-size:11px;color:#999;margin-top:10px;line-height:1.5}
  @media(prefers-color-scheme:dark){.source{color:#777}}
  @media(max-width:600px){
    .chart-wrap{height:300px}
    body{padding:16px 12px}
  }
</style>
</head>
<body>

<div class="legend">
  <span><span class="dot" style="background:#1AAEAE"></span>Kove — annual sales</span>
</div>

<div class="chart-wrap">
  <canvas id="salesChart" role="img" aria-label="Bar chart of annual motorcycle sales from 2018 to 2026 with product launch milestones"></canvas>
</div>

<p class="source">
  Data sources: Zhang Xue interviews (CCTV Face to Face, 21CBR, The Paper, Sina). 2020–2021 figures are estimates based on Zhang Xue's stated growth trajectory. Hover/tap bars for details.
</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
(function(){
  var isDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  var gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
  var tickColor = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.45)';

  var labels = ['2018','2019','2020','2021','2022','2023'];
  var koveData = [800, 3000, 12000, 20000, 28000, 30000];

  var yearLabels = {
    id: 'yearLabels',
    afterDraw: function(chart) {
      var ctx = chart.ctx;
      var xScale = chart.scales.x;
      var yScale = chart.scales.y;
      var years = ['2018','2019','2020','2021','2022','2023'];
      var yBase = yScale.getPixelForValue(0);
      ctx.save();
      ctx.font = '600 13px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = '#444444';
      years.forEach(function(yr) {
        var xPos = xScale.getPixelForValue(yr);
        ctx.fillText(yr, xPos, yBase + 10);
      });
      ctx.restore();
    }
  };

  new Chart(document.getElementById('salesChart'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Kove (凯越)',
          data: koveData,
          backgroundColor: '#1AAEAE',
          borderRadius: 5,
          barPercentage: 0.55
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 30, bottom: 40 } },
      scales: {
        x: {
          grid: { display: false },
          ticks: { display: false },
          border: { display: false }
        },
        y: {
          beginAtZero: true,
          max: 35000,
          grid: { color: gridColor },
          ticks: {
            color: tickColor,
            font: { size: 11 },
            callback: function(v) { return v >= 1000 ? Math.round(v/1000) + 'k' : v; }
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var v = ctx.parsed.y;
              if (!v) return '';
              var formatted = v >= 1000 ? (v/1000).toLocaleString() + 'k' : v;
              return 'Annual sales: ' + formatted + ' units';
            }
          }
        }
      }
    },
    plugins: [yearLabels]
  });
})();
</script>
</body>
</html>
